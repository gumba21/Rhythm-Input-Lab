name: tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m py_compile app.py backend.py console.py rhythm_input_lab_core.py fnf_importer.py self_test.py ril_version.py
      - name: Check JavaScript syntax
        run: node --check web/app.js && node --check web/visualizer.js
      - name: Run self-test
        run: python self_test.py
