name: bootstrap-cleanup

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.head_commit.message == 'Run repository cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply cleanup
        run: python .bootstrap/cleanup.py
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run project self-test
        run: python self_test.py
      - name: Check browser JavaScript syntax
        run: node --check web/app.js
      - name: Commit cleaned source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Cleanup project and fix hurt-note support"
          git push origin HEAD:develop
